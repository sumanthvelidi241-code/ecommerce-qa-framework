name: TestNG Regression CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Regression Suite via Maven
      run: mvn test -DsuiteXmlFile=testng.xml

    - name: Upload TestNG Reports Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testng-execution-reports
        path: test-output/
